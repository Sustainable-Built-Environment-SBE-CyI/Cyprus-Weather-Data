name: Collect Cyprus weather

on:
  schedule:
    # Run at 2, 12, 22, 32, 42 and 52 minutes past each UTC hour.
    - cron: "2,12,22,32,42,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cyprus-weather-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect LIMASSOL and TEPAK
        run: python github_collector.py

      - name: Commit updated history
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo "No data changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data
          git commit -m "Weather update $(date -u +'%Y-%m-%d %H:%M UTC')"

          # Incorporate any repository changes made while this job was running.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
